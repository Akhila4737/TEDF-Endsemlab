<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registration Form</title>
  <style>
    :root{font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4f7fb;margin:0}
    .container{background:#fff;padding:28px;border-radius:12px;box-shadow:0 6px 24px rgba(20,30,60,0.08);width:360px}
    h2{margin:0 0 14px;font-size:20px;color:#102a43}
    .field{margin-bottom:12px}
    label{display:block;font-size:13px;color:#243b53;margin-bottom:6px}
    input[type="text"],input[type="email"],input[type="password"],select{width:100%;padding:10px;border:1px solid #dfe7ef;border-radius:8px;font-size:14px}
    .radios, .checkboxes{display:flex;gap:12px;flex-wrap:wrap}
    .small{font-size:13px;color:#486581}
    .actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
    button{background:#0b6efd;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .note{font-size:12px;color:#6b7c93}
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="regForm" action="#" method="post">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input id="fullname" name="fullname" type="text" required placeholder="Your full name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters">
      </div>

      <div class="field">
        <label>Gender</label>
        <div class="radios">
          <label><input type="radio" name="gender" value="male" required> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div> 
      </div>

      <div class="field">
        <label>Courses (select at least one)</label>
        <div class="checkboxes">
          <label><input type="checkbox" name="courses" value="web"> Web Development</label>
          <label><input type="checkbox" name="courses" value="datasci"> Data Science</label>
          <label><input type="checkbox" name="courses" value="ai"> Artificial Intelligence</label>
          <label><input type="checkbox" name="courses" value="design"> UI/UX Design</label>
        </div>
      </div>

      <div class="actions">
        <div class="note">We'll never share your info.</div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('regForm');
    form.addEventListener('submit', function(e){
      // client-side validation: ensure at least one course selected
      const courses = Array.from(document.querySelectorAll('input[name="courses"]'));
      const checked = courses.some(c => c.checked);
      if(!checked){
        e.preventDefault();
        alert('Please select at least one course.');
        return false;
      }

      // For demo: prevent actual submission and show collected values in console
      e.preventDefault();
      const data = new FormData(form);
      const obj = {
        fullname: data.get('fullname'),
        email: data.get('email'),
        gender: data.get('gender'),
        courses: data.getAll('courses')
      };
      console.log('Form submitted (demo):', obj);
      alert('Registration submitted — check console for demo data.');
    });
  </script>
</body>
</html>
